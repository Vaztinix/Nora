<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moved | Nora Studio</title>

<meta name="description" content="Nora Studio has moved to a new domain.">
<link rel="icon" type="image/png" href="nora.png">

<style>
:root {
    --bg: #0b0f1a;
    --bg-soft: #12182b;
    --card: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.08);
    --primary: #aeefff;
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.7);
    --radius: 18px;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, #1b2a55, transparent),
                radial-gradient(900px 500px at 90% 10%, #2a1b55, transparent),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.notice-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3rem 2rem;
    text-align: center;
    max-width: 500px;
    width: 90%;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

.lock-icon {
    font-size: 4rem;
    margin-bottom: 1.5rem;
    display: inline-block;
    filter: drop-shadow(0 0 20px rgba(174,239,255,0.4));
}

h1 {
    font-size: 2.2rem;
    margin: 0 0 10px 0;
}

p {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.5;
    margin-bottom: 2rem;
}

.url-highlight {
    color: var(--primary);
    font-weight: 600;
}

.btn {
    padding: 14px 28px;
    border-radius: 999px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: .25s;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 1rem;
    text-decoration: none;
}

.btn-primary {
    background: var(--primary);
    color: #000;
    box-shadow: 0 10px 30px rgba(174,239,255,.25);
}

.btn-primary:hover {
    transform: translateY(-4px);
    box-shadow: 0 15px 35px rgba(174,239,255,.35);
}

footer {
    position: absolute;
    bottom: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
}
</style>
</head>

<body>

<main class="notice-card">
    <div class="lock-icon">🔒</div>
    <h1>We've Moved!</h1>
    <p>Nora has officially moved to a new home at <span class="url-highlight">vaztinix.dev</span>. You can access your new dashboard using the link below.</p>
    <a href="https://vaztinix.dev/dashboard" class="btn btn-primary">Go to New Dashboard</a>
</main>

<footer>© 2026 Nora | Privacy-First AI & Moderation for Discord</footer>

</body>
</html>
