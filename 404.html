<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found</title>

<meta name="description" content="404 — The page you’re looking for doesn’t exist. Return to the Nora homepage.">
<meta property="og:title" content="404 — Page Not Found | Nora">
<meta property="og:description" content="This page doesn’t exist. Return safely to Nora.">
<meta property="og:image" content="https://vaztinix.github.io/Nora/nora.png">
<meta property="og:type" content="website">

<link rel="icon" href="nora.png" type="image/png">

<style>

:root{
--bg:#0b0f1a;
--card:rgba(255,255,255,0.06);
--card-hover:rgba(255,255,255,0.04);
--border:rgba(255,255,255,0.08);
--primary:#aeefff;
--accent:#7aa2ff;
--text:#ffffff;
--muted:rgba(255,255,255,0.7);
--radius:18px;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:"Inter","Segoe UI",system-ui,sans-serif;
color:var(--text);
background:var(--bg);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
overflow:hidden;
}

/* Background Glow */

body::before,
body::after{
content:"";
position:absolute;
width:900px;
height:900px;
border-radius:50%;
filter:blur(140px);
opacity:.35;
z-index:0;
}

body::before{
background:#2f4fff;
top:-300px;
left:-300px;
animation:float 18s infinite alternate ease-in-out;
}

body::after{
background:#7aa2ff;
bottom:-300px;
right:-300px;
animation:float 20s infinite alternate-reverse ease-in-out;
}

@keyframes float{
from{transform:translateY(0px);}
to{transform:translateY(60px);}
}

main{
position:relative;
z-index:2;
width:100%;
max-width:720px;
padding:2rem;
}

/* Logo */

.logo{
margin-bottom:18px;
}

.logo img{
width:60px;
height:60px;
border-radius:12px;
}

/* Badge */

.badge{
display:inline-block;
padding:6px 14px;
border-radius:999px;
background:rgba(174,239,255,0.12);
color:var(--primary);
font-weight:700;
font-size:.75rem;
letter-spacing:.6px;
margin-bottom:22px;
}

/* Card */

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:var(--radius);
padding:46px 36px;
backdrop-filter:blur(14px);
transition:all .25s ease;
}

.card:hover{
background:var(--card-hover);
transform:translateY(-6px);
}

/* Typography */

h1{
font-size:clamp(3.5rem,6vw,5rem);
margin:0;
letter-spacing:2px;
color:var(--primary);
}

h2{
margin-top:12px;
font-size:1.6rem;
font-weight:700;
}

p{
margin:18px 0 32px;
color:var(--muted);
font-size:1.05rem;
line-height:1.5;
}

/* Buttons */

.actions{
display:flex;
gap:16px;
justify-content:center;
flex-wrap:wrap;
}

.btn{
padding:14px 26px;
border-radius:999px;
font-weight:800;
border:none;
cursor:pointer;
transition:.25s ease;
display:inline-flex;
align-items:center;
gap:10px;
text-decoration:none;
}

.btn-primary{
background:var(--primary);
color:#000;
box-shadow:0 10px 30px rgba(174,239,255,0.25);
}

.btn-primary:hover{
transform:translateY(-4px);
box-shadow:0 15px 40px rgba(174,239,255,0.35);
}

.btn-ghost{
background:transparent;
border:2px solid var(--border);
color:var(--text);
}

.btn-ghost:hover{
border-color:var(--primary);
}

/* Footer */

.footer{
margin-top:26px;
font-size:.85rem;
color:var(--muted);
opacity:.7;
}

/* Mobile */

@media (max-width:600px){

.card{
padding:36px 24px;
}

h2{
font-size:1.4rem;
}

}

</style>
</head>

<body>

<main>

<div class="logo">
<img src="nora.png" alt="Nora Logo">
</div>

<div class="badge">ERROR 404</div>

<div class="card">

<h1>404</h1>

<h2>Page Not Found</h2>

<p>
The page you're looking for doesn't exist, may have moved,
or you might not have permission to access it.
</p>

<div class="actions">

<a href="index.html" class="btn btn-primary">
Return Home
</a>

<a href="https://discord.gg/cXsZr3cMEB" class="btn btn-ghost" target="_blank">
Support Server
</a>

</div>

</div>

</main>

</body>
</html>
