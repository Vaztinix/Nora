<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Nora | Archived - Moved to vaztinix.dev</title>

<meta name="description" content="The Nora installation page has moved. Install the privacy-first Discord moderation bot at our new ecosystem domain: vaztinix.dev/install.">

<meta property="og:title" content="Add Nora | Archived Site">
<meta property="og:description" content="Nora's installation portal has migrated to a new ecosystem domain. Redirecting to vaztinix.dev/install.">
<meta property="og:image" content="https://vaztinix.github.io/Nora/nora.png">
<meta property="og:type" content="website">

<!-- Automatic redirect to the new site after 10 seconds -->
<meta http-equiv="refresh" content="10;url=https://vaztinix.dev/install">

<link rel="icon" type="image/png" href="nora.png">

<style>
:root{
--bg:#0b0f1a;
--bg-soft:#12182b;
--card:rgba(255,255,255,0.06);
--card-hover:rgba(255,255,255,0.12);
--border:rgba(255,255,255,0.08);
--primary:#aeefff;
--accent:#7aa2ff;
--text:#ffffff;
--muted:rgba(255,255,255,0.7);
--radius:18px;
}

body{
margin:0;
font-family:"Inter","Segoe UI",system-ui,sans-serif;
background:
radial-gradient(1200px 600px at 10% -10%, #1b2a55, transparent),
radial-gradient(900px 500px at 90% 10%, #2a1b55, transparent),
var(--bg);
color:var(--text);
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.container{
width:100%;
max-width:460px;
padding:1.5rem;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:var(--radius);
padding:40px 32px;
text-align:center;
backdrop-filter: blur(14px);
transition:.25s;
}

.card:hover{
background:var(--card-hover);
transform:translateY(-4px);
}

.archived-notice {
color: #ff9999;
font-weight: 600;
font-size: 0.85rem;
letter-spacing: 1px;
text-transform: uppercase;
margin-bottom: 16px;
display: block;
}

/*Title*/
h1{
margin:0 0 16px;
font-size:1.8rem;
color: var(--primary);
}

/*Description*/
p{
color:var(--muted);
font-size:1.05rem;
line-height: 1.5;
margin-bottom:28px;
}

.btn{
padding:14px 26px;
border-radius:999px;
font-weight:800;
border:none;
cursor:pointer;
transition:.25s;
display:inline-flex;
align-items:center;
justify-content:center;
gap:10px;
width:100%;
text-decoration: none;
font-size: 1rem;
}

.btn-primary{
background:var(--primary);
color:#000;
box-shadow:0 10px 30px rgba(174,239,255,.25);
}

.btn-primary:hover{
transform:translateY(-4px);
box-shadow:0 15px 40px rgba(174,239,255,0.35);
}

.trust{
margin-top:24px;
font-size:0.85rem;
color:var(--muted);
line-height:1.4;
opacity: 0.8;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <span class="archived-notice">Archived Site</span>

    <h1>Installation Has Moved</h1>

    <p>
      The Nora ecosystem and bot installation portal have officially transferred to our new domain. To securely add Nora to your server, please proceed to the new site.
    </p>

    <a href="https://vaztinix.dev/install" class="btn btn-primary">
      Continue to New Installation
    </a>

    <div class="trust">
      Automatically redirecting to vaztinix.dev in 10 seconds...
    </div>

  </div>
</div>

<script>
// Fallback script redirect to ensure the user is routed to the new domain
setTimeout(function() {
  window.location.href = "https://vaztinix.dev/install";
}, 10000);
</script>

</body>
</html>
