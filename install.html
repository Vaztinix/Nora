<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Install Nora</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: white;
  font-family: sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

/* Glass card */
.card {
  width: 360px;
  padding: 28px;
  border-radius: 20px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(18px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  text-align: center;
}

/* Title */
h1 {
  margin-bottom: 10px;
}

/* Description */
p {
  font-size: 0.9rem;
  opacity: 0.85;
}

/* Features */
.features {
  text-align: left;
  margin: 18px 0;
  font-size: 0.85rem;
  opacity: 0.9;
}

/* Button */
.install-btn {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  color: white;
  background: linear-gradient(135deg, #5865F2, #404EED);
  transition: 0.3s;
}

.install-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(88,101,242,0.6);
}
</style>
</head>

<body>

<div class="card">
  <h1>Install Nora</h1>
  <p>Privacy-first moderation & utility for your Discord server.</p>

  <div class="features">
    ✔ Smart moderation tools<br>
    ✔ Privacy-focused systems<br>
    ✔ Clean dashboard control<br>
    ✔ Fast + reliable responses
  </div>

  <button class="install-btn" onclick="installBot()">
    Continue to Discord →
  </button>
</div>

<script>
function installBot() {
  const clientId = "1375943730951098549";

  const url =
    "https://discord.com/oauth2/authorize" +
    "?client_id=" + clientId +
    "&scope=bot%20applications.commands" +
    "&permissions=274877991936";

  window.location.href = url;
}
</script>

</body>
</html>
