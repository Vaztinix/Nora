<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nora Discord Callback</title>
<style>
  body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #1e1e1e; color: white; font-family: sans-serif; }
  h2 { text-align: center; }
</style>
</head>
<body>
  <div id="loading">
    <h2>Processing Discord login...</h2>
  </div>

<script>
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const token = params.get('access_token');

  if (token) {
    sessionStorage.setItem('discord_token', token);
    window.location.href = 'index.html#loggedin';
  } else {
    document.getElementById('loading').innerHTML = "<h2>Discord login failed. Redirecting...</h2>";
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 2000);
  }
</script>
</body>
</html>
