<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nora Discord Callback</title>
</head>
<body>
<script>
  // 1️⃣ Check if the URL has the access_token from Discord
  const hash = window.location.hash.substring(1); // remove '#'
  const params = new URLSearchParams(hash);
  const token = params.get('access_token');

  if (token) {
    // 2️⃣ Store token temporarily in sessionStorage
    sessionStorage.setItem('discord_token', token);

    // 3️⃣ Redirect back to the main page
    // We'll pass a hash so index.html can pick it up if needed
    window.location.href = 'index.html#loggedin';
  } else {
    // No token? Go back to index
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
