<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nora Discord Callback</title>
<script>
  // Immediately process the token before rendering anything
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const token = params.get('access_token');
  const tokenType = params.get('token_type');

  if (token) {
    // Save to localStorage for site-wide, persistent login
    localStorage.setItem('discord_token', token);
    if (tokenType) localStorage.setItem('token_type', tokenType);

    // Redirect to the dashboard using replace() to prevent back-button loops
    window.location.replace('login.html'); 
  } else {
    // If something went wrong, redirect after a brief message
    document.write('<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0b0f1a;color:white;font-family:sans-serif;"><h2>Discord login failed. Redirecting...</h2></div>');
    // Redirect back to the login page so they can try again
    setTimeout(() => window.location.replace('login.html'), 2000);
  }
</script>
</head>
<body></body>
</html>
